<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus on Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Style+Script&display=swap"
    rel="stylesheet" />
  <style>
    * {
        box-sizing: border-box;
    }

    body {
      background-color: rgba(72, 163, 0, 0.07);
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    main {
      padding: 0 16px 32px;
    }

    .title {
      font-size: 64px;
      color: #48a300;
      text-align: center;
    }

    .title span {
      color: #61481c;
    }

    .calendar p{
      text-align: center;
    }

    .app-container {
      background-color: #fbfbfb;
      max-width: 660px;
      margin-inline: auto;
      border-radius: 15px;
      padding: 32px 48px;
      box-shadow: 0 0 8px 0px rgba(0, 0, 0, 0.1);
    }

    .sun-icon {
      vertical-align: middle;
      margin-left: 16px;
    }

    .progress-label {
      font-size: 14px;
      color: #858585;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 30px;
      background-color: rgba(72, 163, 0, 0.1);
      border-radius: 15px;
      margin-bottom: 42px;
    }

    .progress-value {
      height: 100%;
      width: 0;
      background-color: #48a300;
      border-radius: 15px;
      font-weight: 500;
      font-size: 10px;
      color: #eeffe0;
      display: flex;
      align-items: center;
      overflow: hidden;
      transition: width 0.2s ease-in-out;
    }

    .progress-value span {
      padding-left: 20px;
      min-width: max-content;
    }

    .error-label {
      font-size: 12px;
      color: #ff5151;
      margin-top: 4px;
      display: none;
    }

    .show-error .error-label {
        display: block;
    }

    .goal-container {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 17px;
      height: 82px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      background-color: #ffffff;
      margin-bottom: 42px;
    }

    .custom-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(97, 72, 28, 0.3);
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-icon {
        display: none;
    }

    .goal-input {
      border: none;
      outline: none;
      padding-left: 22px;
      font-family: inherit;
      font-size: 16px;
      align-self: stretch;
      width: 100%;
      font-weight: 500;
    }

    .goal-input::placeholder {
      color: #d9d9d9;
    }

    .quote {
      font-weight: 500;
      text-align: center;
    }

    .made-with {
      font-weight: 500;
      font-size: 10px;
      text-align: center;
      color: #858585;
      margin-top: 10px;
    }

    .completed .custom-checkbox {
        background: #48A300;
        border-color: #48A300;
    }

    .completed .check-icon {
        display: block;
    }

    .completed .goal-input {
        color: #48A300;
        text-decoration-line: line-through;
    }


    @media (max-width: 768px) {
      .title {
        font-size: 32px;
      }

      .app-container {
        padding: 16px 32px;
      }

      .goal-container {
        height: 64px;
        margin-bottom: 24px;
        border-radius: 12px;
      }

      .custom-checkbox {
        width: 20px;
        height: 20px;
      }

      .made-with {
        margin-top: 32px;
      }

      .progress-bar {
        height: 24px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1 class="title">Focus on <span>Today</span></h1>
    <div class="calendar">
      <p><span class="weekDays">Monday</span></p> <!--Day-->
<!--      <p><span class="day">01</span> <span class="month">January</span> <span class="year">2024</span></p> &lt;!&ndash;Date&ndash;&gt;-->
      <p><span class="mainDay">01 January 2024</span></p> <!--Date-->
    </div>

    <div class="app-container">
      <h2 class="subtitle">
          <span>Today</span>
          <img class="sun-icon" src="./images/Sun.svg" alt="sun" />
          <!-- Add a button for adding more tasks -->
          <!--<button id="addTaskButton">Add Task</button>-->
      </h2>
      <p class="progress-label">Raise the bar by completing your goals!</p>
      <div class="progress-bar">
        <div class="progress-value">
          <span>2/3 Completed</span>
        </div>
        <p class="error-label">Please set all the 3 goals!</p>
      </div>

      <div class="goal-container">
        <div class="custom-checkbox">
          <img class="check-icon" src="./images/check-icon.svg" alt="check-icon" />
        </div>
        <input id="first" class="goal-input" type="text" placeholder="Add new goal... " />
      </div>
      <div class="goal-container">
        <div class="custom-checkbox">
          <img class="check-icon" src="./images/check-icon.svg" alt="check-icon" />
        </div>
        <input id="second" class="goal-input" type="text" placeholder="Add new goal... " />
      </div>
      <div class="goal-container">
        <div class="custom-checkbox">
          <img class="check-icon" src="./images/check-icon.svg" alt="check-icon" />
        </div>
        <input id="third" class="goal-input" type="text" placeholder="Add new goal... " />
      </div>
    </div>
    <p class="quote">“Move one step ahead, today!”</p>
    <p class="made-with">Made with ❤️ by Mohammad Saheb Mansoori</p>
  </main>

  <script>
    const checkBoxList = document.querySelectorAll('.custom-checkbox')
    const inputFields = document.querySelectorAll('.goal-input')
    const errorLabel = document.querySelector('.error-label')
    const progressLabel = document.querySelector('.progress-label')
    const progressBar = document.querySelector('.progress-bar')
    const progressValue = document.querySelector('.progress-value')
    const calendar = document.querySelectorAll('.calendar p');
    let getWeekDays = document.querySelector('.weekDays');
    let CurrentDate = document.querySelector('.mainDay');


    function needWeekDays(){
      var days = [
          "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
      ];
      let currentDate = new Date();
      let dayOfWeek = days[currentDate.getDay()];
      return dayOfWeek;
    }

    getWeekDays.innerHTML = needWeekDays();

    function getCurrDate (){
      let months = [
        "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"
      ];
      let currDate = new Date();
      let day = currDate.getDate();
      let monthIndex = currDate.getMonth();
      let year = currDate.getFullYear();
      let monthName = months[monthIndex];

      return day + " " + monthName + " " + year;
    }

    CurrentDate.innerHTML = getCurrDate();


    const allQuotes = [
      'Raise the bar by completing your goals!',
      'Well begun is half done!',
      'Just a step away, keep going!',
      'Whoa! You just completed all the goals, time for chill :D',
    ]

    // const allGoals = JSON.parse(localStorage.getItem('allGoals')) || {
    //   first: {
    //     name: '',
    //     completed: false,
    //   },
    //   second: {
    //     name: '',
    //     completed: false,
    //   },
    //   third: {
    //     name: '',
    //     completed: false,
    //   },
    // }

    const allGoals = JSON.parse(localStorage.getItem('allGoals')) || {}

    let completedGoalsCount = Object.values(allGoals).filter(
      (goal) => goal.completed
    ).length

    progressValue.style.width = `${(completedGoalsCount / inputFields.length) * 100}%`
    progressValue.firstElementChild.innerText = `${completedGoalsCount}/${inputFields.length} completed`
    progressLabel.innerText = allQuotes[completedGoalsCount]

    checkBoxList.forEach((checkbox) => {
      checkbox.addEventListener('click', (e) => {
        const allGoalsAdded = [...inputFields].every(function (input) {
          return input.value
        })

        if (allGoalsAdded) {
          checkbox.parentElement.classList.toggle('completed')
          const inputId = checkbox.nextElementSibling.id
          allGoals[inputId].completed = !allGoals[inputId].completed
          completedGoalsCount = Object.values(allGoals).filter(
            (goal) => goal.completed
          ).length

          progressValue.style.width = `${(completedGoalsCount / inputFields.length) * 100}%`
          progressValue.firstElementChild.innerText = `${completedGoalsCount}/${inputFields.length} completed`
          progressLabel.innerText = allQuotes[completedGoalsCount]

          localStorage.setItem('allGoals', JSON.stringify(allGoals))
        } else {
          progressBar.classList.add('show-error')
        }
      })
    })

    inputFields.forEach((input) => {
      if (allGoals[input.id]) {
        input.value = allGoals[input.id].name

        if (allGoals[input.id].completed) {
          input.parentElement.classList.add('completed')
        }
      }

      input.addEventListener('focus', () => {
        progressBar.classList.remove('show-error')
      })

      input.addEventListener('input', (e) => {
        if (allGoals[input.id] && allGoals[input.id].completed) {
          input.value = allGoals[input.id].name
          return
        }

        if (allGoals[input.id]) {
          allGoals[input.id].name = input.value
        } else {
          allGoals[input.id] = {
            name: input.value,
            completed: false,
          }
        }

        localStorage.setItem('allGoals', JSON.stringify(allGoals))
      })
    });
  </script>
</body>

</html>
